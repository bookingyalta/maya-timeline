<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#121b2b"><title>История Майи</title><script src="https://telegram.org/js/telegram-web-app.js"></script><style>
:root{color-scheme:dark;--bg:#111827;--panel:#1c2738;--line:#354357;--text:#f4f6fb;--muted:#a9b5c6;--accent:#78b4ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.55 system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:620px;margin:auto;padding:24px 16px 40px}h1{font-size:25px;margin:0 0 8px}h2{font-size:19px;margin:0 0 12px}p{margin:10px 0}.muted{color:var(--muted);font-size:13px}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;margin:14px 0;white-space:pre-wrap;overflow-wrap:anywhere}.title{font-weight:700;font-size:18px}.date{color:var(--accent);font-weight:650;margin-bottom:8px}.button{border:0;border-radius:12px;background:var(--accent);color:#101b2b;font:700 15px system-ui;padding:13px 16px;cursor:pointer;width:100%;margin-top:10px}.button.secondary{background:#2d3b50;color:var(--text)}.year{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:16px 0}.year button{background:#2d3b50;border:1px solid var(--line);border-radius:10px;color:var(--text);font-size:22px;width:52px;height:46px;cursor:pointer}.year strong{font-size:23px}.dates{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.dates button{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:10px;padding:12px 4px;font:600 15px system-ui;cursor:pointer}.dates button.active{background:var(--accent);color:#101b2b}.divider{height:1px;background:var(--line);margin:20px 0}.hidden{display:none}.empty{text-align:center;color:var(--muted);padding:22px 8px}button:focus-visible{outline:3px solid #fff;outline-offset:2px}
</style></head><body><main class="wrap"><h1>🕊️ История Майи</h1><div id="home"><p class="muted" id="updated"></p><div class="card"><div class="muted">📍 Последнее событие</div><div class="date" id="homeDate"></div><div class="title" id="homeTitle"></div><p id="homeBody"></p></div><button class="button" id="toDates">📅 События по датам</button></div><div id="timeline" class="hidden"><h2>📅 События по датам</h2><div id="selected" class="card hidden" aria-live="polite"></div><div class="year"><button id="prevYear" aria-label="Предыдущий год">‹</button><strong id="yearLabel"></strong><button id="nextYear" aria-label="Следующий год">›</button></div><div id="dateButtons" class="dates"></div><div class="divider"></div><button class="button secondary" id="toHome">↩️ Вернуться к последнему событию</button></div><p id="error" class="muted" role="alert"></p></main><script>
const tg=window.Telegram?.WebApp;try{tg?.ready();tg?.expand();}catch(e){}
const $=id=>document.getElementById(id);let records=[],year=new Date().getFullYear(),selected=null;
function formatDate(s){const [y,m,d]=s.split('-');return `${d}.${m}.${y}`}
function showHome(){ $('timeline').classList.add('hidden');$('home').classList.remove('hidden');selected=null;document.querySelectorAll('#dateButtons button').forEach(x=>x.classList.remove('active'));$('selected').classList.add('hidden');window.scrollTo(0,0)}
function showTimeline(){ $('home').classList.add('hidden');$('timeline').classList.remove('hidden');selected=null;renderYear();window.scrollTo(0,0)}
function renderYear(){ $('yearLabel').textContent=year;const list=records.filter(e=>+e.date.slice(0,4)===year);$('dateButtons').replaceChildren();$('selected').classList.add('hidden');if(!list.length){const d=document.createElement('div');d.className='empty';d.textContent='В этом году событий пока нет';d.style.gridColumn='1 / -1';$('dateButtons').append(d)}for(const e of list){const b=document.createElement('button');b.textContent=formatDate(e.date).slice(0,5);b.setAttribute('aria-label',formatDate(e.date)+' — '+e.title);b.onclick=()=>{selected=e;document.querySelectorAll('#dateButtons button').forEach(x=>x.classList.remove('active'));b.classList.add('active');const s=$('selected');s.replaceChildren();const date=document.createElement('div');date.className='date';date.textContent=formatDate(e.date);const title=document.createElement('div');title.className='title';title.textContent=e.title;const body=document.createElement('p');body.textContent=e.body;s.append(date,title,body);s.classList.remove('hidden');window.scrollTo({top:0,behavior:'smooth'})};$('dateButtons').append(b)}}
// Каждый новый вход начинает просмотр с последнего события.
// При возвращении в приложение из другого экрана Telegram также сбрасываем выбор.
window.addEventListener('pageshow', showHome);
document.addEventListener('visibilitychange', ()=>{if(document.visibilityState==='hidden') showHome()});
try{tg?.onEvent('activated', showHome)}catch(e){}
$('toDates').onclick=showTimeline;$('toHome').onclick=showHome;$('prevYear').onclick=()=>{year--;renderYear()};$('nextYear').onclick=()=>{year++;renderYear()};
fetch('./events.json?ts='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(data=>{records=Array.isArray(data)?data:(data.events||[]);records.sort((a,b)=>a.date.localeCompare(b.date)||(+a.id||0)-(+b.id||0));const latest=records.at(-1);if(latest){year=+latest.date.slice(0,4);$('homeDate').textContent=formatDate(latest.date);$('homeTitle').textContent=latest.title;$('homeBody').textContent=latest.body}else{$('homeTitle').textContent='Хронология пока готовится'}$('updated').textContent='Последнее обновление: '+(data.updated_at||'—')}).catch(e=>{$('error').textContent='Не удалось загрузить события. Проверьте файл events.json и обновите страницу.';console.error(e)});
</script></body></html>
